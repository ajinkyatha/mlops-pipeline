apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mlflow-data, namespace: mlops }
spec:
  accessModes: [ ReadWriteOnce ]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops
  labels: { app: mlflow }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow } }
  template:
    metadata: { labels: { app: mlflow } }
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.15.1
          command: ["mlflow","server","--host","0.0.0.0","--port","5000",
                    "--backend-store-uri","sqlite:////mlflow/mlflow.db",
                    "--default-artifact-root","/mlflow/artifacts"]
          ports: [{ containerPort: 5000 }]
          volumeMounts: [{ name: data, mountPath: /mlflow }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mlflow-data }
---
apiVersion: v1
kind: Service
metadata: { name: mlflow, namespace: mlops }
spec:
  selector: { app: mlflow }
  ports: [{ port: 5000, targetPort: 5000 }]
