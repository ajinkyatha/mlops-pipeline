groups:
  - name: mlops.rules
    rules:
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, sum(rate(model_inference_seconds_bucket[5m])) by (le)) > 0.25
        for: 5m
        labels: { severity: warning, app: churn-api }
        annotations:
          summary: "p95 inference latency above 250ms"
      - alert: PredictionDistributionShift
        expr: model_positive_rate > 0.6 or model_positive_rate < 0.1
        for: 15m
        labels: { severity: warning, app: churn-api }
        annotations:
          summary: "Churn-positive prediction rate outside expected band"
          description: "The live positive-prediction rate has drifted from the training baseline — possible concept drift; check the Evidently report."
      - alert: NoPredictions
        expr: rate(model_predictions_total[10m]) == 0
        for: 10m
        labels: { severity: critical, app: churn-api }
        annotations:
          summary: "Model API is serving no predictions"
