apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-api
  namespace: mlops
  labels: { app: churn-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: churn-api } }
  template:
    metadata:
      labels: { app: churn-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: churn-api
          image: ghcr.io/ajinkyatha/mlops-pipeline/churn-api:latest
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: churn-api, namespace: mlops }
spec:
  selector: { app: churn-api }
  ports: [{ port: 80, targetPort: 8080 }]
