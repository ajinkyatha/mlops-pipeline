name: MLOps CI · Train → Evaluate → Gate → Build

on:
  push:
    branches: [ main ]
    paths: [ "src/**", "data/**", "requirements.txt", ".github/workflows/ci-train-eval.yml" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  train-eval:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:./mlruns
      MIN_ACCURACY: "0.76"
      MIN_F1: "0.60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Generate data
        run: python data/generate_data.py
      - name: Train (logs to MLflow)
        run: python src/train.py
      - name: Evaluate — quality gate
        run: python src/evaluate.py            # fails the build if metrics miss thresholds
      - name: Upload MLflow runs + model
        uses: actions/upload-artifact@v4
        with:
          name: model-and-mlruns
          path: |
            mlruns/
            models/

  build-image:
    needs: train-eval
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python data/generate_data.py && python src/train.py
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/churn-api:${{ github.sha }},ghcr.io/${{ github.repository }}/churn-api:latest
